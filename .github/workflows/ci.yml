# Blackbeard VOID PRO — build-only CI. NEVER run live audio/HID tests here.
name: Blackbeard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow never needs write access to the repository or secrets.
permissions:
  contents: read

concurrency:
  group: blackbeard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-safe-tests:
    name: Linux x86_64 / GCC / safe tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BVP_CI_APT_APPIMAGE_V1: official Ubuntu archive recovery on CI images
      # whose APT sources only expose third-party repositories.
      - name: Install build dependencies
        run: bash tools/ci-apt-bootstrap.sh

      - name: Verify pkg-config dependencies
        run: |
          pkg-config --exists gtk+-3.0 ayatana-appindicator3-0.1 hidapi-hidraw json-glib-1.0

      - name: Clean build (warnings are errors)
        run: |
          make clean
          make -j2 CC="gcc -Werror"

      # This is the SAFE Makefile target, not test-live-audio.
      # No binary launch, sound routing, pw-cli, pactl, or HID access.
      - name: Run safe tests
        run: make test CC="gcc -Werror"

  build-appimage:
    name: Linux x86_64 / AppImage (after safe tests)
    needs: build-and-safe-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ubuntu build and packaging dependencies
        run: |
          bash tools/ci-apt-bootstrap.sh
          sudo apt-get install -y --no-install-recommends \
            curl file patchelf librsvg2-dev libgirepository1.0-dev \
            gobject-introspection desktop-file-utils

      - name: Download linuxdeploy and GTK3 plugin
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/bvp-linuxdeploy"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage' \
            --output "$tools_dir/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh' \
            --output "$tools_dir/linuxdeploy-plugin-gtk.sh"
          chmod +x "$tools_dir/linuxdeploy-x86_64.AppImage" "$tools_dir/linuxdeploy-plugin-gtk.sh"
          echo "$tools_dir" >> "$GITHUB_PATH"

      # The existing packager uses make install to place the binary, filters,
      # themes, languages, desktop entry, and icon into a temporary AppDir.
      # No GUI, HID, headset, PipeWire stream, or virtual sink is started.
      - name: Build AppImage (packaging only)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          DEPLOY_GTK_VERSION: '3'
          LINUXDEPLOY: linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.sha }}
        run: bash tools/build-appimage.sh

      - name: Verify bundled content without launching Blackbeard
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./*.AppImage)
          if (( ${#packages[@]} != 1 )); then
            printf 'Expected exactly one built AppImage, got %d\n' "${#packages[@]}" >&2
            exit 1
          fi
          mkdir -p dist/appimage
          name="Blackbeard_VOID_PRO-${GITHUB_SHA:0:12}-x86_64.AppImage"
          mv -- "${packages[0]}" "dist/appimage/$name"
          chmod +x "dist/appimage/$name"
          extracted="$RUNNER_TEMP/bvp-appimage-extract"
          mkdir -p "$extracted"
          (cd "$extracted" && "$GITHUB_WORKSPACE/dist/appimage/$name" --appimage-extract >/dev/null)
          root="$extracted/squashfs-root"
          test -x "$root/usr/bin/blackbeard_void_pro"
          test -s "$root/usr/share/applications/blackbeard-void-pro.desktop"
          test -s "$root/usr/share/icons/hicolor/256x256/apps/blackbeard-void-pro.png"
          for generation in v1 v2 v3; do
            for channel in LL LR RL RR; do
              test -s "$root/usr/share/blackbeard_void_pro/filters/$generation/ir_$channel.wav"
            done
          done
          test "$(find "$root/usr/share/blackbeard_void_pro/themes" -name '*.json' | wc -l)" -eq 7
          test "$(find "$root/usr/share/blackbeard_void_pro/languages" -name '*.json' | wc -l)" -eq 9
          echo 'AppImage content validated; the application was NOT started.'

      - name: Upload AppImage artifact (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: Blackbeard-VOID-PRO-linux-x86_64-AppImage
          path: dist/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
